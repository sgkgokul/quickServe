version: '3.8'

services:
  # =============================================
  # PostgreSQL + PostGIS
  # =============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: quickserve-postgres
    environment:
      POSTGRES_DB: quickserve
      POSTGRES_USER: quickserve
      POSTGRES_PASSWORD: quickserve123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickserve"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # Redis
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: quickserve-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # Zookeeper (Kafka dependency)
  # =============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: quickserve-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # =============================================
  # Apache Kafka
  # =============================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: quickserve-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # =============================================
  # Kafka UI (Dev Tool)
  # =============================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quickserve-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: quickserve-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  postgres_data:

